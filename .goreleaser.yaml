version: 2

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      # Intentionally keep debug info by omitting GoReleaser's default `-s -w`
      - -X github.com/bluekeyes/nflogfiled/internal/version.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: "{{ .ProjectName }}_{{ .Version }}"
    files:
      - LICENSE
      - README.md
      - packaging/nflogfiled.service
      - packaging/nflogfiled.sysusers
      - packaging/flags
      - packaging/logrotate

nfpms:
  - formats: [deb, rpm]
    file_name_template: "{{ .ConventionalFileName }}"
    description: Minimal daemon to write nftables/nflog logs to files
    homepage: https://github.com/bluekeyes/nflogfiled
    maintainer: Billy Keyes <commits@billykeyes.dev>
    license: MIT
    contents:
      - src: LICENSE
        dst: /usr/share/doc/nflogfiled/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/nflogfiled/LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: packaging/nflogfiled.service
        dst: /usr/lib/systemd/system/nflogfiled.service
        file_info:
          mode: 0644
      - src: packaging/nflogfiled.sysusers
        dst: /usr/lib/sysusers.d/nflogfiled.conf
        file_info:
          mode: 0644
      - src: packaging/flags
        dst: /etc/nflogfiled/flags
        type: config|noreplace
        file_info:
          mode: 0644
      - src: packaging/logrotate
        dst: /usr/share/doc/nflogfiled/examples/logrotate
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

# Release notes are written by hand in the GitHub UI before publishing the draft
changelog:
  disable: true

release:
  draft: true
